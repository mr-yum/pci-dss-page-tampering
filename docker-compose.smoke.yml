services:
  tests:
    extends:
      file: docker-compose.build.yml
      service: dev
    command: npm x -- node-builder test --suite=smoke --watch
    env_file:
      - env.d/smoke-test
    volumes:
      - ${BUILDKITE_BUILD_CHECKOUT_PATH:-.}:/workdir
      - /workdir/node_modules

secrets:
  npmrc:
    file: ${NPMRC_FILE}

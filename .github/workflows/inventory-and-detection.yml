name: Run inventory and detection

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Specific target to process (leave empty for all targets)'
        required: false
        type: string
      mode:
        description: 'Execution mode'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - inventory
          - detection
  schedule:
    # Run daily at 12:00 PM UTC, night time in Sydney/Melbourne
    - cron: '0 12 * * *'
  push:
    branches: ['main']

env:
  NPMRC: ${{ secrets.NPMRC_RO_FILE }}

jobs:
  run-inventory-and-detection:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate required secrets
        run: |
          [ -n "${{ secrets.INVENTORY_REPO_PAT }}" ] || { echo "INVENTORY_REPO_PAT secret is missing"; exit 1; }
          [ -n "${{ secrets.SLACK_OAUTH_TOKEN }}" ] || { echo "SLACK_OAUTH_TOKEN secret is missing"; exit 1; }

      - name: Configure npm auth for both registries
        run: |
          set -euo pipefail

          # Safety checks so you fail fast if secrets are missing
          [ -n "${NPMRC:-}" ] || { echo "NPMRC env variable is empty, make sure the NPMRC_RO_FILE secret is set"; exit 1; }

          echo "$NPMRC" > $HOME/.npmrc

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci
          echo "✅ Dependencies installed successfully"

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            fonts-liberation \
            libappindicator3-1 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libc6 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libexpat1 \
            libfontconfig1 \
            libgbm1 \
            libgcc1 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libstdc++6 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxrandr2 \
            libxrender1 \
            libxss1 \
            libxtst6 \
            lsb-release \
            wget \
            xdg-utils

      - name: Run PCI DSS detection
        timeout-minutes: 30
        run: |
          echo "▶️ Running PCI DSS Page Tampering Detection..."

          # Build CLI arguments
          CLI_ARGS="--repo https://github.com/mr-yum/script-inventory"
          CLI_ARGS="$CLI_ARGS --git-token ${{ secrets.INVENTORY_REPO_PAT }}"
          CLI_ARGS="$CLI_ARGS --slack-token ${{ secrets.SLACK_OAUTH_TOKEN }}"

          # Add mode (default: all for scheduled runs)
          MODE="${{ github.event.inputs.mode || 'all' }}"
          CLI_ARGS="$CLI_ARGS --mode $MODE"

          # Add target if specified (for workflow_dispatch)
          TARGET="${{ github.event.inputs.target }}"
          if [ -n "$TARGET" ]; then
            CLI_ARGS="$CLI_ARGS --target $TARGET"
          fi

          echo "Executing: npm start -- $CLI_ARGS"
          npm start -- $CLI_ARGS

          echo "✅ PCI DSS detection completed successfully"

name: Run inventory and detection

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Specific target to process (leave empty for all targets)'
        required: false
        type: string
      mode:
        description: 'Execution mode'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - inventory
          - detection
  schedule:
    # Run daily at 12:00 PM UTC, night time in Sydney/Melbourne
    - cron: '0 12 * * *'
  push:
    branches: ['main']

jobs:
  run-inventory-and-detection:
    runs-on: ubuntu-latest

    # Run inside Puppeteer's official image, which ships Node 24, the Chrome
    # build pinned by this Puppeteer version, and all of Chrome's system
    # libraries. This removes the need to install Node, download Chrome, or
    # apt-install Chrome's dependencies in the workflow itself.
    #
    # The image tag MUST track the `puppeteer` version in package.json so the
    # bundled Chrome matches the build the app launches. A Renovate rule
    # (renovate.json) caps this image below the next major so it cannot jump
    # ahead of the npm package; bump both together when upgrading Puppeteer. Run
    # as root so checkout, npm, and git can write the workspace; the app launches
    # Chrome with --no-sandbox so root is safe.
    container:
      image: ghcr.io/puppeteer/puppeteer:25.1.0
      options: --user root

    # The image installs Chrome under pptruser's home; point Puppeteer at it so
    # it is found when steps run as root (HOME=/root).
    env:
      PUPPETEER_CACHE_DIR: /home/pptruser/.cache/puppeteer

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate required secrets
        run: |
          [ -n "${{ secrets.INVENTORY_REPO_PAT }}" ] || { echo "INVENTORY_REPO_PAT secret is missing"; exit 1; }
          [ -n "${{ secrets.SLACK_OAUTH_TOKEN }}" ] || { echo "SLACK_OAUTH_TOKEN secret is missing"; exit 1; }
          [ -n "${{ vars.INVENTORY_REPO_URL }}" ] || { echo "INVENTORY_REPO_URL variable is missing"; exit 1; }

      - name: Install dependencies
        # Chrome is already baked into the image; skip Puppeteer's browser
        # download during npm ci.
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          echo "📦 Installing dependencies..."
          npm ci
          echo "✅ Dependencies installed successfully"

      - name: Run PCI DSS detection
        timeout-minutes: 30
        run: |
          echo "▶️ Running PCI DSS Page Tampering Detection..."

          # Build CLI arguments
          CLI_ARGS="--repo ${{ vars.INVENTORY_REPO_URL }}"
          CLI_ARGS="$CLI_ARGS --git-token ${{ secrets.INVENTORY_REPO_PAT }}"
          CLI_ARGS="$CLI_ARGS --slack-token ${{ secrets.SLACK_OAUTH_TOKEN }}"
          CLI_ARGS="$CLI_ARGS --git-user-name '${{ vars.GIT_USER_NAME }}'"
          CLI_ARGS="$CLI_ARGS --git-user-email '${{ vars.GIT_USER_EMAIL }}'"

          # Add mode (default: all for scheduled runs)
          MODE="${{ github.event.inputs.mode || 'all' }}"
          CLI_ARGS="$CLI_ARGS --mode $MODE"

          # Add target if specified (for workflow_dispatch)
          TARGET="${{ github.event.inputs.target }}"
          if [ -n "$TARGET" ]; then
            CLI_ARGS="$CLI_ARGS --target $TARGET"
          fi

          echo "Executing: npm start -- $CLI_ARGS"
          npm start -- $CLI_ARGS

          echo "✅ PCI DSS detection completed successfully"

name: Run inventory and detection

on:
  schedule:
    # Run daily at 12:00 PM UTC, night time in Sydney/Melbourne
    - cron: '0 12 * * *'
  push:
    branches: ['main']
  pull_request:
    branches: ['**']

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  CODEARTIFACT_REGISTRY: ${{ secrets.CODEARTIFACT_REGISTRY }}
  CODEARTIFACT_SCOPE: ${{ secrets.CODEARTIFACT_SCOPE }}
  CODEARTIFACT_TOKEN: ${{ secrets.CODEARTIFACT_TOKEN }}
  INVENTORY_REPO_PAT: ${{ secrets.INVENTORY_REPO_PAT }}
  NPMRC: ${{ secrets.NPMRC_RO_FILE }}

jobs:
  run-inventory-and-detection:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            fonts-liberation \
            libappindicator3-1 \
            libasound2 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libc6 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libexpat1 \
            libfontconfig1 \
            libgbm1 \
            libgcc1 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libstdc++6 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxrandr2 \
            libxrender1 \
            libxss1 \
            libxtst6 \
            lsb-release \
            wget \
            xdg-utils

      - name: Configure git for inventory and detection
        run: |
          [ -n "${INVENTORY_REPO_PAT:-}" ] || { echo "INVENTORY_REPO_PAT is empty"; exit 1; }

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Configure npm auth for both registries
        run: |
          set -euo pipefail

          # Safety checks so you fail fast if secrets are missing
          [ -n "${NPMRC:-}" ] || { echo "NPMRC env variable is empty, make sure the NPMRC_RO_FILE secret is set"; exit 1; }

          echo "$NPMRC" > $HOME/.npmrc

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci
          echo "✅ Dependencies installed successfully"

      - name: Run start command
        run: |
          echo "▶️ Testing start command..."
          npm start || echo "Start command completed (timeout or success)"
          echo "✅ Start command test completed"

name: Continuous Integration

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']

env:
  NPMRC: ${{ secrets.NPMRC_RO_FILE }}

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure npm auth for both registries
        run: |
          set -euo pipefail

          # Safety checks so you fail fast if secrets are missing
          [ -n "${NPMRC:-}" ] || { echo "NPMRC env variable is empty, make sure the NPMRC_RO_FILE secret is set"; exit 1; }

          echo "$NPMRC" > $HOME/.npmrc

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci
          echo "✅ Dependencies installed successfully"

      - name: Audit dependencies
        run: |
          echo "📦 Auditing dependencies..."
          npm audit
          echo "✅ Dependencies audited successfully"

      - name: Run formatting and linting commands
        timeout-minutes: 30
        run: |
          echo "▶️ Running formatting and linting commands..."
          npm list prettier
          npm run check:formatting
          npm run check:linting
          npm run check:typing
          echo "✅ Formatting and linting commands completed"

      - name: Run unit tests
        timeout-minutes: 30
        run: |
          echo "▶️ Running unit tests..."
          npm run test:unit
          echo "✅ Unit tests completed"

name: Continuous Integration

on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci
          echo "✅ Dependencies installed successfully"

      - name: Audit dependencies
        run: |
          echo "📦 Auditing dependencies..."
          npm audit --audit-level=high
          echo "✅ Dependencies audited successfully"

      - name: Run formatting and linting commands
        timeout-minutes: 30
        run: |
          echo "▶️ Running formatting and linting commands..."
          npm run check:formatting
          npm run check:linting
          npm run check:typing
          echo "✅ Formatting and linting commands completed"

      # Bundling is a separate failure mode from type checking: esbuild resolves
      # the real import graph and the collector bundle is what infra/ deploys.
      # The unit suites for both already run in the next step: `npm run test:unit`
      # selects the `unit` project (which matches collector/src) and `unit-agent`
      # (agent/src, jsdom), so nothing is duplicated here.
      - name: Build browser agent and collector bundles
        timeout-minutes: 10
        run: |
          echo "▶️ Building browser agent and collector bundles..."
          npm run build:agent
          npm run build:collector
          echo "✅ Bundles built successfully"

      - name: Run unit tests
        timeout-minutes: 30
        run: |
          echo "▶️ Running unit tests..."
          npm run test:unit
          echo "✅ Unit tests completed"

      - name: Run integration tests
        timeout-minutes: 30
        run: |
          echo "▶️ Running integration tests..."
          npm run test:integration
          echo "✅ Integration tests completed"

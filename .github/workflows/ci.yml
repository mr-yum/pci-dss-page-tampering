name: Continuous Integration

on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci
          echo "✅ Dependencies installed successfully"

      - name: Audit dependencies
        run: |
          echo "📦 Auditing dependencies..."
          npm audit --audit-level=high
          echo "✅ Dependencies audited successfully"

      - name: Run formatting and linting commands
        timeout-minutes: 30
        run: |
          echo "▶️ Running formatting and linting commands..."
          npm run check:formatting
          npm run check:linting
          npm run check:typing
          echo "✅ Formatting and linting commands completed"

      - name: Run unit tests
        timeout-minutes: 30
        run: |
          echo "▶️ Running unit tests..."
          npm run test:unit
          echo "✅ Unit tests completed"

      - name: Run integration tests
        timeout-minutes: 30
        run: |
          echo "▶️ Running integration tests..."
          npm run test:integration
          echo "✅ Integration tests completed"

name: CI run-on-github

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  NPM_REGISTRY: ${{ secrets.NPM_REGISTRY }}

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        echo "📦 Installing dependencies..."
        npm ci
        echo "✅ Dependencies installed successfully"
        
    - name: Check formatting
      run: |
        echo "✨ Checking code formatting..."
        npm run check:formatting
        echo "✅ Formatting check completed"
        
    - name: Check linting
      run: |
        echo "🔍 Running linting checks..."
        npm run check:linting
        echo "✅ Linting checks completed"
        
    - name: Check typing
      run: |
        echo "📝 Running type checks..."
        npm run check:typing
        echo "✅ Type checks completed"
        
    - name: Build project
      run: |
        echo "🏗️ Building project..."
        npm run build:js
        echo "✅ Build completed successfully"
        
    - name: Run start command
      run: |
        echo "▶️ Testing start command..."
        timeout 30s npm start || echo "Start command completed (timeout or success)"
        echo "✅ Start command test completed"
        
